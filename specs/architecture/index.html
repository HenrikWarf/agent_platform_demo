<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gemini Enterprise Agent Platform — Architecture Slide Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-display: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Google Sans Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Google Cloud Theme Colors */
      --gcp-blue: #1a73e8;
      --gcp-blue-hover: #1557b0;
      --gcp-blue-light: #e8f0fe;
      --gcp-green: #1e8e3e;
      --gcp-yellow: #f9ab00;
      --gcp-red: #d93025;
      
      /* Light Mode Palette */
      --bg-primary: #f8f9fa;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-surface-subtle: #f1f3f4;
      --border-subtle: #dadce0;
      --border-strong: #bdc1c6;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-tertiary: #80868b;
      --card-highlight: #e8f0fe;
      --card-highlight-border: #aecbfa;
      --card-highlight-text: #174ea6;
      --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      --shadow-md: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
      --shadow-lg: 0 2px 6px 2px rgba(60,64,67,0.15), 0 8px 24px 4px rgba(60,64,67,0.15);
      --badge-bg: #e8f0fe;
      --badge-text: #1a73e8;
      --chip-bg: #f1f3f4;
      --chip-text: #3c4043;
    }

    [data-theme="dark"] {
      --bg-primary: #121316;
      --bg-surface: #1e1f23;
      --bg-surface-elevated: #282a2f;
      --bg-surface-subtle: #2d3135;
      --border-subtle: #3c4043;
      --border-strong: #5f6368;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-tertiary: #80868b;
      --card-highlight: #172b4d;
      --card-highlight-border: #1a73e8;
      --card-highlight-text: #8ab4f8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.6);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.7);
      --badge-bg: #172b4d;
      --badge-text: #8ab4f8;
      --chip-bg: #2d3135;
      --chip-text: #e8eaed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ─── Top Header Bar ────────────────────────────────────────── */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      height: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 20;
      box-shadow: var(--shadow-sm);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4285F4, #34A853, #FBBC05, #EA4335);
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(66, 133, 244, 0.4);
    }

    .brand-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slide-jump-select {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .slide-jump-select:focus {
      border-color: var(--gcp-blue);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background-color: var(--bg-surface-subtle);
      color: var(--text-secondary);
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.05rem;
    }

    .icon-btn:hover {
      background-color: var(--bg-surface-subtle);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* ─── Top Progress Bar ──────────────────────────────────────── */
    .progress-bar-container {
      height: 3px;
      background-color: var(--border-subtle);
      width: 100%;
      position: relative;
      z-index: 15;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4285f4, #1a73e8);
      width: 12.5%;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Main Stage Layout (Split View) ───────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    /* Left Side: Content Panel */
    .content-panel {
      flex: 0 0 44%;
      max-width: 44%;
      height: 100%;
      overflow-y: auto;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      scroll-behavior: smooth;
    }

    .content-panel::-webkit-scrollbar {
      width: 6px;
    }

    .content-panel::-webkit-scrollbar-thumb {
      background-color: var(--border-strong);
      border-radius: 3px;
    }

    .slide-badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-pill {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--badge-bg);
      color: var(--badge-text);
    }

    .slide-number-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-tertiary);
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    /* Key Takeaway Card */
    .takeaway-card {
      background: var(--card-highlight);
      border-left: 4px solid var(--gcp-blue);
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .takeaway-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--card-highlight-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .takeaway-text {
      font-size: 0.96rem;
      line-height: 1.5;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Talking Points Section */
    .talking-points-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .talking-points-heading {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .point-card {
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .point-card:hover {
      border-color: var(--gcp-blue);
      transform: translateY(-1px);
    }

    .point-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .point-desc {
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .point-desc ul {
      margin-left: 20px;
      margin-top: 6px;
    }

    .point-desc li {
      margin-bottom: 4px;
    }

    .point-desc code {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      background-color: var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-primary);
    }

    /* Service Tags */
    .services-tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .service-chip {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--chip-bg);
      color: var(--chip-text);
      border: 1px solid var(--border-subtle);
    }

    /* Right Side: Large Slide Image Canvas */
    .image-panel {
      flex: 0 0 56%;
      max-width: 56%;
      height: 100%;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
      user-select: none;
    }

    .image-container-card {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 180px);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: zoom-in;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .image-container-card:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--gcp-blue);
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .image-overlay-tools {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .image-container-card:hover .image-overlay-tools {
      opacity: 1;
    }

    .tool-badge {
      background: rgba(32, 33, 36, 0.75);
      backdrop-filter: blur(8px);
      color: white;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Floating Arrow Overlays on Image */
    .img-nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s ease;
      z-index: 8;
    }

    [data-theme="dark"] .img-nav-arrow {
      background: rgba(30, 31, 35, 0.85);
    }

    .img-nav-arrow:hover {
      opacity: 1;
      transform: translateY(-50%) scale(1.08);
      background: var(--gcp-blue);
      color: white;
      border-color: var(--gcp-blue);
    }

    .img-nav-prev {
      left: 12px;
    }

    .img-nav-next {
      right: 12px;
    }

    /* ─── Bottom Navigation & Control Bar ──────────────────────── */
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      height: 64px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 20;
    }

    .nav-btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-nav:hover:not(:disabled) {
      background-color: var(--bg-surface-subtle);
      border-color: var(--border-strong);
    }

    .btn-nav.primary {
      background-color: var(--gcp-blue);
      color: white;
      border-color: var(--gcp-blue);
    }

    .btn-nav.primary:hover:not(:disabled) {
      background-color: var(--gcp-blue-hover);
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.4);
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Slide Thumbnails / Dots */
    .slide-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot-btn {
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background-color: var(--border-strong);
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dot-btn:hover {
      background-color: var(--gcp-blue);
      transform: scale(1.2);
    }

    .dot-btn.active {
      width: 28px;
      background-color: var(--gcp-blue);
      border-radius: 6px;
    }

    .keyboard-guide {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key-cap {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-secondary);
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    /* ─── Lightbox Fullscreen Modal ────────────────────────────── */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(18, 19, 22, 0.94);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox-modal.open {
      display: flex;
      opacity: 1;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.8);
      cursor: default;
    }

    .lightbox-close-btn {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lightbox-close-btn:hover {
      background: rgba(255,255,255,0.4);
    }

    /* ─── Responsive Adjustments ────────────────────────────────── */
    @media (max-width: 1024px) {
      main {
        flex-direction: column-reverse;
        overflow-y: auto;
      }
      .content-panel {
        flex: 1 1 auto;
        max-width: 100%;
        height: auto;
        border-right: none;
        border-top: 1px solid var(--border-subtle);
        padding: 24px;
      }
      .image-panel {
        flex: 0 0 auto;
        max-width: 100%;
        height: 50vh;
        padding: 16px;
      }
      body {
        overflow: auto;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 0 14px;
      }
      .brand-title-text {
        display: none;
      }
      .keyboard-guide {
        display: none;
      }
      .slide-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body data-theme="light">

  <!-- Top Header -->
  <header>
    <div class="brand-section">
      <a href="#" class="brand-logo">
        <span class="logo-badge">✦</span>
        <span class="brand-title-text">Gemini Enterprise Agent Platform</span>
      </a>
      <span class="brand-tag">Architecture Deck</span>
    </div>

    <div class="header-controls">
      <select id="slideJumpSelect" class="slide-jump-select" aria-label="Jump to Slide">
        <!-- Injected via JavaScript -->
      </select>
      <span class="slide-counter" id="slideCounterDisplay">1 / 8</span>
      <button class="icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme (T)">☀️</button>
      <button class="icon-btn" id="fullscreenToggleBtn" title="Toggle Fullscreen (F)">⛶</button>
    </div>
  </header>

  <!-- Progress Bar -->
  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="progressBarFill"></div>
  </div>

  <!-- Main Stage Split View -->
  <main>
    <!-- Left Column: Rich Content & Talking Points -->
    <section class="content-panel" id="contentPanel">
      <div class="slide-badge-row">
        <span class="section-pill" id="sectionPill">Section 00</span>
        <span class="slide-number-badge" id="slideNumberBadge">Slide 1 of 8</span>
      </div>

      <h1 class="slide-title" id="slideTitle">Loading Slide...</h1>

      <!-- Key Takeaway Banner -->
      <div class="takeaway-card">
        <div class="takeaway-label">
          <span>💡</span> Key Takeaway
        </div>
        <p class="takeaway-text" id="takeawayText">Loading executive summary...</p>
      </div>

      <!-- Deep Dive Talking Points -->
      <div class="talking-points-container">
        <div class="talking-points-heading">
          <span>🎙️</span> Architecture Breakdown & Speaker Notes
        </div>
        <div id="talkingPointsList" style="display: flex; flex-direction: column; gap: 12px;">
          <!-- Injected dynamically -->
        </div>
      </div>

      <!-- GCP Services & Protocols Tags -->
      <div class="talking-points-container" style="margin-top: 6px;">
        <div class="talking-points-heading">
          <span>☁️</span> GCP Services & Integrated Standards
        </div>
        <div class="services-tag-cloud" id="servicesCloud">
          <!-- Injected dynamically -->
        </div>
      </div>
    </section>

    <!-- Right Column: High-Res Diagram Canvas -->
    <section class="image-panel">
      <button class="img-nav-arrow img-nav-prev" id="imgPrevBtn" title="Previous Slide (←)">‹</button>
      <button class="img-nav-arrow img-nav-next" id="imgNextBtn" title="Next Slide (→)">›</button>

      <div class="image-container-card" id="imageContainerCard" title="Click to view full-resolution lightbox zoom">
        <div class="image-overlay-tools">
          <span class="tool-badge">🔍 Click to Zoom</span>
        </div>
        <img src="00_overview_gcp_agent_platform_architecture.jpg" alt="Architecture Diagram" class="slide-img" id="slideImage" />
      </div>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <footer>
    <div class="nav-btn-group">
      <button class="btn-nav" id="prevBtn" disabled>
        <span>←</span> Previous
      </button>
      <button class="btn-nav primary" id="nextBtn">
        Next <span>→</span>
      </button>
    </div>

    <!-- Slide Indicator Dots -->
    <div class="slide-dots" id="slideDotsContainer">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Keyboard Navigation Hints -->
    <div class="keyboard-guide">
      <span>Navigate:</span>
      <kbd class="key-cap">←</kbd>
      <kbd class="key-cap">→</kbd>
      <kbd class="key-cap">Space</kbd>
      <span>| Zoom:</span>
      <kbd class="key-cap">Z</kbd>
      <span>| Theme:</span>
      <kbd class="key-cap">T</kbd>
    </div>
  </footer>

  <!-- Fullscreen Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-close-btn" id="lightboxCloseBtn" title="Close Lightbox (Esc)">✕</button>
    <img src="" alt="Fullscreen Diagram" class="lightbox-img" id="lightboxImg" />
  </div>

  <script>
    // ─── Complete 8-Slide Data Model ──────────────────────────────
    const SLIDES_DATA = [
      {
        id: 1,

    // ─── Application State & DOM Elements ─────────────────────────
    let currentSlideIndex = 0;
    const totalSlides = SLIDES_DATA.length;

    const sectionPill = document.getElementById("sectionPill");
    const slideNumberBadge = document.getElementById("slideNumberBadge");
    const slideTitle = document.getElementById("slideTitle");
    const takeawayText = document.getElementById("takeawayText");
    const talkingPointsList = document.getElementById("talkingPointsList");
    const servicesCloud = document.getElementById("servicesCloud");
    const slideImage = document.getElementById("slideImage");
    const imageContainerCard = document.getElementById("imageContainerCard");
    const progressBarFill = document.getElementById("progressBarFill");
    const slideCounterDisplay = document.getElementById("slideCounterDisplay");
    const slideJumpSelect = document.getElementById("slideJumpSelect");
    const slideDotsContainer = document.getElementById("slideDotsContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const imgPrevBtn = document.getElementById("imgPrevBtn");
    const imgNextBtn = document.getElementById("imgNextBtn");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const fullscreenToggleBtn = document.getElementById("fullscreenToggleBtn");
    const lightboxModal = document.getElementById("lightboxModal");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxCloseBtn = document.getElementById("lightboxCloseBtn");
    const contentPanel = document.getElementById("contentPanel");

    // ─── Initialize Controls & Select Dropdown ────────────────────
    function initUI() {
      // Populate select dropdown
      slideJumpSelect.innerHTML = "";
      SLIDES_DATA.forEach((slide, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.textContent = `Slide ${slide.id}: ${slide.title}`;
        slideJumpSelect.appendChild(option);
      });

      // Populate indicator dots
      slideDotsContainer.innerHTML = "";
      SLIDES_DATA.forEach((_, idx) => {
        const dot = document.createElement("button");
        dot.className = `dot-btn ${idx === 0 ? "active" : ""}`;
        dot.setAttribute("aria-label", `Go to slide ${idx + 1}`);
        dot.addEventListener("click", () => goToSlide(idx));
        slideDotsContainer.appendChild(dot);
      });

      // Render initial slide
      renderSlide(0);
    }

    // ─── Render Slide Function ───────────────────────────────────
    function renderSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      currentSlideIndex = index;
      const slide = SLIDES_DATA[index];

      // Update text details
      sectionPill.textContent = slide.sectionBadge || slide.sectionNum;
      slideNumberBadge.textContent = `Slide ${slide.id} of ${totalSlides}`;
      slideTitle.textContent = slide.title;
      takeawayText.innerHTML = slide.takeaway;

      // Render talking points
      talkingPointsList.innerHTML = slide.points.map(pt => `
        <div class="point-card">
          <div class="point-title">
            <span style="color: var(--gcp-blue);">▸</span> ${pt.title}
          </div>
          <div class="point-desc">${pt.desc}</div>
        </div>
      `).join("");

      // Render service chips
      servicesCloud.innerHTML = slide.services.map(svc => `
        <span class="service-chip">${svc}</span>
      `).join("");

      // Update image with smooth transition
      slideImage.style.opacity = "0.2";
      slideImage.style.transform = "scale(0.98)";
      setTimeout(() => {
        slideImage.src = slide.image;
        slideImage.alt = slide.title;
        slideImage.style.opacity = "1";
        slideImage.style.transform = "scale(1)";
      }, 100);

      // Update progress and counters
      const progressPercent = ((index + 1) / totalSlides) * 100;
      progressBarFill.style.width = `${progressPercent}%`;
      slideCounterDisplay.textContent = `${index + 1} / ${totalSlides}`;
      slideJumpSelect.value = index;

      // Update dot states
      const dots = slideDotsContainer.querySelectorAll(".dot-btn");
      dots.forEach((dot, idx) => {
        dot.classList.toggle("active", idx === index);
      });

      // Update button disabled states
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === totalSlides - 1;
      imgPrevBtn.style.opacity = index === 0 ? "0.3" : "0.7";
      imgNextBtn.style.opacity = index === totalSlides - 1 ? "0.3" : "0.7";

      // Reset scroll position on content panel
      contentPanel.scrollTop = 0;
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        renderSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        renderSlide(currentSlideIndex - 1);
      }
    }

    function goToSlide(index) {
      renderSlide(index);
    }

    // ─── Lightbox Modal Handlers ─────────────────────────────────
    function openLightbox() {
      const currentSlide = SLIDES_DATA[currentSlideIndex];
      lightboxImg.src = currentSlide.image;
      lightboxModal.classList.add("open");
    }

    function closeLightbox() {
      lightboxModal.classList.remove("open");
    }

    // ─── Theme Toggle ────────────────────────────────────────────
    function toggleTheme() {
      const currentTheme = document.body.getAttribute("data-theme") || "light";
      const newTheme = currentTheme === "light" ? "dark" : "light";
      document.body.setAttribute("data-theme", newTheme);
      themeToggleBtn.textContent = newTheme === "dark" ? "🌙" : "☀️";
    }

    // ─── Fullscreen Toggle ───────────────────────────────────────
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Fullscreen request error:", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // ─── Event Listeners ─────────────────────────────────────────
    prevBtn.addEventListener("click", prevSlide);
    nextBtn.addEventListener("click", nextSlide);
    imgPrevBtn.addEventListener("click", prevSlide);
    imgNextBtn.addEventListener("click", nextSlide);
    slideJumpSelect.addEventListener("change", (e) => goToSlide(parseInt(e.target.value, 10)));
    themeToggleBtn.addEventListener("click", toggleTheme);
    fullscreenToggleBtn.addEventListener("click", toggleFullscreen);
    imageContainerCard.addEventListener("click", openLightbox);
    lightboxCloseBtn.addEventListener("click", closeLightbox);
    lightboxModal.addEventListener("click", (e) => {
      if (e.target === lightboxModal || e.target === lightboxCloseBtn) {
        closeLightbox();
      }
    });

    // ─── Global Keyboard Shortcuts ───────────────────────────────
    window.addEventListener("keydown", (e) => {
      // If user is focused on select element, let default behavior work
      if (document.activeElement === slideJumpSelect) return;

      if (lightboxModal.classList.contains("open")) {
        if (e.key === "Escape") closeLightbox();
        return;
      }

      switch (e.key) {
        case "ArrowRight":
        case "PageDown":
        case " ": // Spacebar
        case "l":
        case "L":
          e.preventDefault();
          nextSlide();
          break;
        case "ArrowLeft":
        case "PageUp":
        case "Backspace":
        case "h":
        case "H":
          e.preventDefault();
          prevSlide();
          break;
        case "Home":
          e.preventDefault();
          goToSlide(0);
          break;
        case "End":
          e.preventDefault();
          goToSlide(totalSlides - 1);
          break;
        case "f":
        case "F":
          e.preventDefault();
          toggleFullscreen();
          break;
        case "t":
        case "T":
          e.preventDefault();
          toggleTheme();
          break;
        case "z":
        case "Z":
        case "Enter":
          e.preventDefault();
          openLightbox();
          break;
        case "1": case "2": case "3": case "4":
        case "5": case "6": case "7": case "8":
          const slideNum = parseInt(e.key, 10) - 1;
          if (slideNum >= 0 && slideNum < totalSlides) {
            goToSlide(slideNum);
          }
          break;
      }
    });

    // ─── Touch Swipe Support for Mobile/Tablet ───────────────────
    let touchStartX = 0;
    let touchEndX = 0;

    window.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (Math.abs(swipeDistance) > 50) {
        if (swipeDistance < 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }

    // Start App
    initUI();
  </script>
