server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://agent-platform-backend-q5c3bhebga-uc.a.run.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host agent-platform-backend-q5c3bhebga-uc.a.run.app;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
