[project]
name = "agent-platform-demo"
version = "1.3.0"
description = "GCP Multi-Agent Marketing Platform using ADK"
authors = [
    {name = "Henrik Warfvinge", email = "henrikw@google.com"},
]
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.5.0,<3.0.0",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-gcp-trace",
    "opentelemetry-exporter-gcp-logging",
    "opentelemetry-sdk",
    "opentelemetry-api",
    "google-cloud-resource-manager>=1.12.0",
    "google-cloud-bigquery>=3.18.0",
    "google-genai>=1.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.156.0",
    "python-dotenv>=1.0.0",
    "gcsfs>=2024.11.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "protobuf>=6.31.1,<7.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
]
requires-python = ">=3.11,<3.13"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]

