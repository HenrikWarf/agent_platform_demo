[project]
name = "agent-platform-demo"
version = "1.3.0"
description = "GCP Multi-Agent Marketing Platform using ADK"
authors = [
    {name = "Henrik Warfvinge", email = "henrikw@google.com"},
]
dependencies = [
    "google-adk[otel-gcp]>=2.6.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "google-cloud-bigquery>=3.18.0",
    "google-genai>=1.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.130.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0",
]

[tool.uv]
# Ensure uv uses public PyPI (overrides any global pip config pointing to private registries)
index-url = "https://pypi.org/simple/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.agents-cli]
# Generation metadata - enables CLI commands to understand project context
name = "agent-platform-demo"
description = "GCP Multi-Agent Marketing Platform with BigQuery analytics, omnichannel strategy, and content generation"
base_template = "adk"
agent_directory = "app"

# Generation context
acli_version = "0.1.3"

[tool.agents-cli.create_params]
# Parameters used during project creation
deployment_target = "agent_runtime"
session_type = "none"
cicd_runner = "skip"
include_data_ingestion = false
datastore = "none"
